# HMS PostgreSQL settings that protect acknowledged writes (CLAUDE.md rule 12).
# Used by the on-site Docker deployment (deploy PR). Do not weaken these for speed.

listen_addresses = '*'          # the proxy/app network only; pg_hba.conf restricts clients

# Durability: a write confirmed to a user survives an abrupt power cut.
fsync = on
synchronous_commit = on
full_page_writes = on
wal_sync_method = fdatasync

# Replication to the standby and WAL archiving (archive_command set by the backup service).
wal_level = replica
max_wal_senders = 5
wal_keep_size = 1GB
# archive_mode stays off until the backup service PR sets archive_command: with archiving
# on and no working command, WAL piles up until the disk is full.
archive_mode = off
archive_timeout = 300           # once archiving is on: switch WAL at least every 5 min (RPO <= 15 min)

timezone = 'UTC'                # store UTC; the app displays Africa/Lagos
log_timezone = 'UTC'

# Never log statement text: it can contain patient data.
log_statement = 'none'
log_min_duration_statement = -1
log_min_error_statement = panic
# Error DETAIL lines echo row values (e.g. "Key (phone)=(...) already exists").
log_error_verbosity = terse
